# FinCore: web (nginx + SPA) → api (NestJS) → db (PostgreSQL 18).
#
#   docker compose up -d --build        start / update
#   docker compose ps                   status and health
#   docker compose logs -f api          follow the API log
#   docker compose down                 stop (data stays in the fincore-db volume)

name: fincore

services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    command: ['postgres', '-c', 'timezone=Asia/Tashkent', '-c', 'log_timezone=Asia/Tashkent']
    env_file: docker/db.env
    environment:
      FINCORE_DB_INIT: ${FINCORE_DB_INIT:-schema}
    volumes:
      - fincore-db:/var/lib/postgresql
      - ./docker/db:/fincore-db:ro
      - ./docker/db/initdb:/docker-entrypoint-initdb.d:ro
      - ./docs/database:/fincore-migrations:ro
    healthcheck:
      # Soddalashtirilgan va xatosiz ishlaydigan healthcheck
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]
    security_opt: ['no-new-privileges:true']

  api:
    build: ./backend
    image: fincore-api:local
    restart: unless-stopped
    env_file: docker/api.env
    environment:
      # DIQQAT: NODE_ENV ni bu yerdan o'chirdik.
      # U docker/api.env faylidan (development) o'qiladi.
      HOST: 0.0.0.0
      PORT: '3000'
      TRUST_PROXY_HOPS: '1'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r) => r.json()).then((b) => process.exit(b.status === 'ok' ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [data, edge]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ['no-new-privileges:true']

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: fincore-web:local
    restart: unless-stopped
    ports:
      - '${FINCORE_BIND:-127.0.0.1}:${FINCORE_HTTP_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ['no-new-privileges:true']

networks:
  data:
    internal: true
  edge: {}

volumes:
  fincore-db: