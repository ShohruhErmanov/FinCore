<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FinCore">
  <title>FinCore</title>
  <!--
    Favicon draws the bare mark, never the tile: at 16px a rounded tile eats the
    padding and the letter collapses. The letterform is also pushed to the edges
    of the box here, because a browser tab gives no room for logo margins.
  -->
  <g transform="translate(32 32) scale(1.34) translate(-32 -32)">
    <g fill="#1A5BF6">
      <rect x="20" y="12" width="9" height="40" rx="2.5"/>
      <rect x="23" y="12" width="21" height="9" rx="2.5"/>
    </g>
    <rect x="23" y="30" width="18" height="9" rx="2.5" fill="#22D3EE"/>
  </g>
</svg>
