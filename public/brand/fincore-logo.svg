<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 214 64" width="214" height="64" role="img" aria-label="FinCore">
  <title>FinCore</title>
  <defs>
    <linearGradient id="fcLogoStem" x1="16" y1="10" x2="29" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8DB4FF"/>
      <stop offset="1" stop-color="#6F9FFF"/>
    </linearGradient>
    <linearGradient id="fcLogoTop" x1="22" y1="10" x2="50" y2="21" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EDF4FF"/>
      <stop offset="1" stop-color="#B3C4DB"/>
    </linearGradient>
  </defs>
  <rect x="16" y="10" width="12" height="44" rx="6" fill="url(#fcLogoStem)"/>
  <rect x="22" y="10" width="28" height="11" rx="5.5" fill="url(#fcLogoTop)"/>
  <rect x="22" y="28" width="22" height="10" rx="5" fill="#6F9FFF"/>
  <circle cx="46" cy="33" r="3" fill="#6EE3AE"/>

  <!-- Wordmark sits on the mark's own baseline (y 52). Weight and tracking match
       the product shell's FINCORE label, so chrome and logo never disagree.
       currentColor lets one file serve light and dark placements.
       Convert to outlines before sending this file to a printer. -->
  <text x="60" y="52"
        font-family="'Inter Tight', Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="700" letter-spacing="1.4" fill="currentColor">FINCORE</text>
</svg>
