<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="FinCore">
  <title>FinCore</title>
  <defs>
    <linearGradient id="fincoreTileBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E3A5C"/>
      <stop offset="1" stop-color="#0F1B2D"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#fincoreTileBg)"/>
  <!-- Tones lifted for the dark ground; scaled about its own centre so padding
       stays even at every export size. -->
  <g transform="translate(32 32) scale(0.8) translate(-32 -32)">
    <g fill="#FF2B00">
      <rect x="20" y="12" width="9" height="40" rx="2.5"/>
      <rect x="23" y="12" width="21" height="9" rx="2.5"/>
    </g>
    <rect x="23" y="30" width="18" height="9" rx="2.5" fill="#FFB800"/>
  </g>
</svg>
